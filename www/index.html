<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#14532d">

  <title>I & E ShambaSmart</title>

  <style>
    :root {
      --green: #166534;
      --green-dark: #14532d;
      --green-light: #dcfce7;
      --background: #f3f7f3;
      --white: #ffffff;
      --text: #17251b;
      --muted: #647067;
      --border: #dce5dd;
      --red: #b91c1c;
      --orange: #b45309;
      --shadow: 0 8px 24px rgba(20, 83, 45, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--background);
      color: var(--text);
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    .brand {
      color: var(--green-dark);
      font-size: 25px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .brand span {
      color: #65a30d;
    }

    .subtitle {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    /* LOGIN */

    .auth-page {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 22px;
      background:
        radial-gradient(circle at top right, #bbf7d0, transparent 38%),
        linear-gradient(135deg, #f0fdf4, #e2e8f0);
    }

    .auth-card {
      width: 100%;
      max-width: 430px;
      padding: 30px;
      background: var(--white);
      border-radius: 20px;
      box-shadow: var(--shadow);
    }

    .auth-card h1 {
      margin-bottom: 6px;
    }

    .auth-card .brand {
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 700;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px #dcfce7;
    }

    .btn {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      border: 0;
      border-radius: 10px;
      font-weight: 700;
      transition: 0.2s;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--green);
      color: white;
    }

    .btn-primary:hover {
      background: var(--green-dark);
    }

    .btn-light {
      background: #e8f5eb;
      color: var(--green-dark);
    }

    .btn-danger {
      background: #fee2e2;
      color: var(--red);
    }

    .btn-full {
      width: 100%;
    }

    .auth-links {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 17px;
    }

    .text-button {
      border: 0;
      padding: 4px 0;
      background: transparent;
      color: var(--green);
      font-size: 14px;
      font-weight: 700;
    }

    .message {
      margin: 14px 0;
      padding: 12px;
      border-radius: 9px;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .message.error {
      color: #991b1b;
      background: #fee2e2;
    }

    .message.success {
      color: #166534;
      background: #dcfce7;
    }

    .message.info {
      color: #92400e;
      background: #fef3c7;
    }

    /* APPLICATION */

    .app-header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 15px 5%;
      background: white;
      border-bottom: 1px solid var(--border);
    }

      gap:
