<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#166534">
  <title>I & E ShambaSmart</title>

  <style>
    :root {
      --green: #166534;
      --green-light: #22c55e;
      --bg: #f3f6f3;
      --card: #ffffff;
      --text: #17251a;
      --muted: #647067;
      --border: #dce5dd;
      --red: #dc2626;
      --blue: #2563eb;
      --shadow: 0 4px 15px rgba(0, 0, 0, .06);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    body.dark {
      --bg: #101810;
      --card: #1c281d;
      --text: #f1f5f1;
      --muted: #a5b4a6;
      --border: #354536;
      --shadow: 0 4px 15px rgba(0, 0, 0, .2);
    }

    button, input, select, textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    .topbar {
      background: var(--green);
      color: white;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 5;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .logo {
      width: 43px;
      height: 43px;
      object-fit: cover;
      border-radius: 12px;
      background: white;
      color: var(--green);
      display: grid;
      place-items: center;
      font-weight: bold;
      flex-shrink: 0;
    }

    .brand h1 {
      margin: 0;
      font-size: 17px;
    }

    .brand small {
      display: block;
      margin-top: 4px;
      opacity: .85;
    }

    .topbar button {
      border: 1px solid rgba(255,255,255,.4);
      background: transparent;
      color: white;
      padding: 9px 12px;
      border-radius: 9px;
    }

    .container {
      max-width: 1050px;
      margin: auto;
      padding: 18px;
      padding-bottom: 95px;
    }

    .page-title {
      font-size: 23px;
      margin: 4px 0 7px;
    }

    .muted {
      color: var(--muted);
      font-size: 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 13px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 16px;
      box-shadow: var(--shadow);
      margin-bottom: 15px;
      min-width: 0;
    }

    .stat-label {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 10px;
    }

    .stat-value {
      font-size: 21px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .green {
      color: #22a052;
    }

    .red {
      color: #ef4444;
    }

    .blue {
      color: #60a5fa;
    }

    .section-title {
      font-size: 18px;
      margin: 6px 0 14px;
    }

    .field {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 600;
    }

    input, select, textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--card);
      color: var(--text);
      padding: 12px;
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--green-light);
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: none;
      border-radius: 10px;
      padding: 12px 15px;
      background: var(--green);
      color: white;
      font-weight: 600;
      gap: 7px;
    }

    .btn:disabled {
      opacity: .55;
      cursor: wait;
    }

    .btn-secondary {
      background: #e5eee6;
      color: #164b28;
    }

    .btn-danger {
      background: #dc2626;
      color: white;
    }

    .btn-block {
      width: 100%;
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th, td {
      padding: 12px 9px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      white-space: nowrap;
    }

    th {
      color: var(--muted);
      font-weight: 600;
    }

    .badge {
      display: inline-block;
      padding: 5px 8px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 600;
    }

    .badge-income {
      color: #15803d;
      background: #dcfce7;
    }

    .badge-expense {
      color: #b91c1c;
      background: #fee2e2;
    }

    .notice {
      border-radius: 10px;
      padding: 12px;
      margin: 12px 0;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .notice-error {
      background: #fee2e2;
      color: #991b1b;
    }

    .notice-success {
      background: #dcfce7;
      color: #166534;
    }

    .notice-info {
      background: #dbeafe;
      color: #1e40af;
    }

    .empty {
      text-align: center;
      padding: 25px 10px;
      color: var(--muted);
    }

    .bottom-nav {
      position: fixed;
      z-index: 10;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--card);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 8px 3px calc(8px + env(safe-area-inset-bottom));
    }

    .nav-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 7px 5px;
      font-size: 11px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      align-items: center;
    }

    .nav-btn span {
      font-size: 20px;
    }

    .nav-btn.active {
      color: var(--green-light);
      font-weight: bold;
    }

    .auth-wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .auth-card {
      width: 100%;
      max-width: 430px;
    }

    .auth-heading {
      text-align: center;
      margin-bottom: 24px;
    }

    .auth-heading .big-logo {
      width: 70px;
      height: 70px;
      border-radius: 20px;
      display: grid;
      place-items: center;
      margin: 0 auto 15px;
      background: var(--green);
      color: white;
      font-size: 28px;
      font-weight: bold;
    }

    .link-btn {
      background: none;
      border: none;
      color: var(--green-light);
      padding: 12px 0 0;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: var(--muted);
    }

    .small {
      font-size: 12px;
    }

    .photo-preview {
      width: 90px;
      height: 90px;
      object-fit: cover;
      border-radius: 14px;
      background: var(--border);
    }

    @media (min-width: 700px) {
      .grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .container {
        padding-top: 25px;
      }
    }
  </style>
</head>

<body>

  <div id="loadingScreen" class="loading">
    Inafungua I & E ShambaSmart...
  </div>

  <!-- LOGIN / REGISTER -->
  <section id="authScreen" class="auth-wrap hidden">
    <div class="card auth-card">

      <div class="auth-heading">
        <div class="big-logo">IE</div>
        <h1>I & E ShambaSmart</h1>
        <p class="muted">Simamia mapato, matumizi na shughuli za shamba.</p>
      </div>

      <div id="loginForm">
        <h2 class="section-title">Ingia kwenye akaunti</h2>

        <form id="loginFormElement">
          <div class="field">
            <label for="loginEmail">Barua pepe</label>
            <input id="loginEmail" type="email" required autocomplete="email">
          </div>

          <div class="field">
            <label for="loginPassword">Nenosiri</label>
            <input id="loginPassword" type="password" required autocomplete="current-password">
          </div>

          <button class="btn btn-block" type="submit">Ingia</button>
        </form>

        <button id="showRegister" class="link-btn">
          Sina akaunti? Jisajili
        </button>
      </div>

      <div id="registerForm" class="hidden">
        <h2 class="section-title">Fungua akaunti</h2>

        <form id="registerFormElement">
          <div class="field">
            <label for="registerName">Jina kamili</label>
            <input id="registerName" required maxlength="100" autocomplete="name">
          </div>

          <div class="field">
            <label for="registerEmail">Barua pepe</label>
            <input id="registerEmail" type="email" required autocomplete="email">
          </div>

          <div class="field">
            <label for="registerPassword">Nenosiri (angalau herufi 6)</label>
            <input id="registerPassword" type="password" minlength="6" required autocomplete="new-password">
          </div>

          <button class="btn btn-block" type="submit">Jisajili</button>
        </form>

        <button id="showLogin" class="link-btn">
          Tayari nina akaunti? Ingia
        </button>
      </div>

      <div id="authMessage" role="status" aria-live="polite"></div>
    </div>
  </section>

  <!-- MAIN APP -->
  <div id="appScreen" class="hidden">

    <header class="topbar">
      <div class="brand">
        <img id="headerLogo" class="logo hidden" alt="Logo ya shamba">
        <div id="headerLogoText" class="logo">IE</div>

        <div>
          <h1>I & E ShambaSmart</h1>
          <small id="headerUser">Karibu</small>
        </div>
      </div>

      <button id="logout
