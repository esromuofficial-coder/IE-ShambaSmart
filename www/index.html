<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I & E ShambaSmart</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f7f2;
      color: #183c28;
    }

    header {
      background: #176b43;
      color: white;
      padding: 20px;
      text-align: center;
    }

    main {
      max-width: 900px;
      margin: 25px auto;
      padding: 15px;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 18px;
      border-radius: 12px;
      box-shadow: 0 3px 12px #0001;
    }

    input, select, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin: 7px 0;
      border-radius: 7px;
      border: 1px solid #ccd8ce;
      font-size: 16px;
    }

    button {
      background: #176b43;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background: #218653;
    }

    .hidden {
      display: none !important;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .stat {
      background: #e2f2e6;
      padding: 15px;
      border-radius: 9px;
      overflow-wrap: anywhere;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 9px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }

    .table-wrap {
      overflow-x: auto;
    }

    #message {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    @media (max-width: 500px) {
      main { margin: 10px auto; }
      .stats { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>

<body>
<header>
  <h1>I & E ShambaSmart</h1>
  <p>Usimamizi wa mapato na matumizi</p>
</header>

<main>
  <section id="loginSection" class="card">
    <h2>Ingia kwenye akaunti</h2>

    <form id="loginForm">
      <input id="email" type="email"
             placeholder="Barua pepe" required>

      <input id="password" type="password"
             placeholder="Nenosiri" minlength="6" required>

      <button id="loginButton" type="submit">Ingia</button>
    </form>

    <button id="showSignup" type="button">Fungua akaunti</button>
    <button id="resetPassword" type="button">Nimesahau nenosiri</button>

    <form id="signupForm" class="hidden">
      <input id="fullName" placeholder="Jina kamili" required>
      <input id="signupEmail" type="email"
             placeholder="Barua pepe" required>
      <input id="signupPassword" type="password"
             placeholder="Nenosiri (angalau herufi 6)"
             minlength="6" required>
      <button type="submit">Jisajili</button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>
  </section>

  <section id="dashboard" class="hidden">
    <div class="card">
      <h2>Karibu, <span id="userName"></span></h2>
      <p id="userEmail"></p>
      <button id="logoutButton">Toka</button>
    </div>

    <div class="stats">
      <div class="stat">
        <p>Jumla ya mapato</p>
        <h3 id="income">TZS 0</h3>
      </div>

      <div class="stat">
        <p>Jumla ya matumizi</p>
        <h3 id="expenses">TZS 0</h3>
      </div>

      <div class="stat">
        <p>Salio</p>
        <h3 id="balance">TZS 0</h3>
      </div>

      <div class="stat">
        <p>Miamala</p>
        <h3 id="count">0</h3>
      </div>
    </div>

    <section class="card">
      <h2>Ongeza muamala</h2>

      <form id="transactionForm">
        <select id="type">
          <option value="income">Mapato</option>
          <option value="expense">Matumizi</option>
        </select>

        <input id="date" type="date" required>
        <input id="description" placeholder="Maelezo" required>
        <input id="person" placeholder="Mhusika (hiari)">
        <input id="amount" type="number"
               min="1" step="1" placeholder="Kiasi cha TZS" required>

        <button id="saveTransaction" type="submit">
          Hifadhi muamala
        </button>
      </form>
    </section>

    <section class="card">
      <h2>Miamala yangu</h2>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Tarehe</th>
              <th>Aina</th>
              <th>Maelezo</th>
              <th>Kiasi</th>
              <th>Futa</th>
            </tr>
          </thead>
          <tbody id="transactions"></tbody>
        </table>
      </div>

      <button id="downloadCSV">Pakua ripoti ya Excel (CSV)</button>
      <button id="printReport">Chapisha / Hifadhi PDF</button>
    </section>
  </section>
</main>

<script type="module">
import { initializeApp }
  from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  sendPasswordResetEmail,
  updateProfile,
  signOut
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  setDoc,
  getDoc,
  collection,
  query,
  where,
  getDocs,
  addDoc,
  deleteDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

/*
 * Tumia configuration ya Firebase ya mradi wako.
 * Thibitisha thamani hizi kwenye Firebase Console.
 */
const firebaseConfig = {
  apiKey: "AIzaSyB8yfl5dkqoN-skeAAJtOwULc_iTyr9tPk",
  authDomain: "ie-shambasmart.firebaseapp.com",
  projectId: "ie-shambasmart",
  storageBucket: "ie-shambasmart.firebasestorage.app",
  messagingSenderId: "895715686352",
  appId: "1:895715686352:web:baa408a762fd60f9cf6bd5",
  measurementId: "G-37FEVMD62V"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = id => document.getElementById(id);

let currentUser = null;
let transactions = [];
let loading = false;

$("date").value = new Date().toISOString().slice(0, 10);

function message(text, error = false) {
  $("message").textContent = text;
  $("message").style.color = error ? "#b42318" : "#176b43";
}

function errorText(error) {
  const code = error?.code || "";

  const known = {
    "auth/invalid-email": "Barua pepe si sahihi.",
    "auth/invalid-credential": "Barua pepe au nenosiri si sahihi.",
    "auth/wrong-password": "Nenosiri si sahihi.",
    "auth/email-already-in-use": "Barua pepe tayari imesajiliwa.",
    "auth/weak-password": "Nenosiri ni fupi sana.",
    "auth/network-request-failed": "Angalia muunganisho wa intaneti.",
    "auth/operation-not-allowed":
      "Washa Email/Password katika Firebase Authentication.",
    "auth/unauthorized-domain":
      "Ongeza domain ya tovuti yako kwenye Authorized domains."
  };

  return known[code] || `Hitilafu: ${code || error.message}`;
}

function money(amount) {
  return "TZS " + new Intl.NumberFormat("en-TZ", {
    maximumFractionDigits: 0
  }).format(Number(amount) || 0);
}

$("loginForm").addEventListener("submit", async event => {
  event.preventDefault();

  if (loading) return;
  loading = true;
  $("loginButton").disabled = true;
  $("loginButton").textContent = "Inaingia...";
  message("");

  try {
    await signInWithEmailAndPassword(
      auth,
      $("email").value.trim(),
      $("password").value
    );
  } catch (error) {
    console.error("Login error:", error);
    message(errorText(error), true);
  } finally {
    loading = false;
    $("loginButton").disabled = false;
    $("loginButton").textContent = "Ingia";
  }
});

$("showSignup").addEventListener("click", () => {
  $("signupForm").classList.toggle("hidden");
});

$("signupForm").addEventListener("submit", async event => {
  event.preventDefault();
  const name = $("fullName").value.trim();
  const email = $("signupEmail").value.trim();
  const password = $("signupPassword").value;

  try {
    const result = await createUserWithEmailAndPassword(
      auth, email, password
    );

    await updateProfile(result.user, { displayName: name });

    /*
     * Mtumiaji mpya hupewa role ya user pekee.
     * Usiruhusu mtumiaji kujipa admin mwenyewe.
     */
    await setDoc(doc(db, "users", result.user.uid), {
      uid: result.user.uid,
      name,
      email,
      role: "user",
      createdAt: serverTimestamp()
    });

    message("Akaunti imefunguliwa.");
  } catch (error) {
    console.error("Signup error:", error);
    message(errorText(error), true);
  }
});

$("resetPassword").addEventListener("click", async () => {
  const email = $("email").value.trim();

  if (!email) {
    message("Andika barua pepe kwanza.", true);
    return;
  }

  try {
    await sendPasswordResetEmail(auth, email);
    message("Ikiwa barua pepe imesajiliwa, maelekezo yametumwa.");
  } catch (error) {
    message(errorText(error), true);
  }
});

$("logoutButton").addEventListener("click", async () => {
  try {
    await signOut(auth);
  } catch (error) {
    message(errorText(error), true);
  }
});

onAuthStateChanged(auth, async user => {
  currentUser = user;

  $("loginSection").classList.toggle("hidden", !!user);
  $("dashboard").classList.toggle("hidden", !user);

  if (!user) {
    transactions = [];
    renderTransactions();
    return;
  }

  $("userName").textContent = user.displayName || "Mtumiaji";
  $("userEmail").textContent = user.email || "";

  try {
    const profileRef = doc(db, "users", user.uid);
    const profile = await getDoc(profileRef);

    if (!profile.exists()) {
      await setDoc(profileRef, {
        uid: user.uid,
        name: user.displayName || "Mtumiaji",
        email: user.email || "",
        role: "user",
        createdAt: serverTimestamp()
      });
    }

    await loadTransactions();
  } catch (error) {
    console.error("Dashboard load error:", error);
    message(
      "Umeingia lakini data haijapakiwa. Kagua Firestore Rules. " +
      errorText(error),
      true
    );
  }
});

async function loadTransactions() {
  const q = query(
    collection(db, "transactions"),
    where("uid", "==", currentUser.uid)
  );

  const snapshot = await getDocs(q);

  transactions = snapshot.docs.map(item => ({
    id: item.id,
    ...item.data()
  }));

  transactions.sort((a, b) =>
    (b.date || "").localeCompare(a.date || "")
  );

  renderTransactions();
}

function renderTransactions() {
  const body = $("transactions");
  body.replaceChildren();

  let income = 0;
  let expenses = 0;

  for (const tx of transactions) {
    const amount = Number(tx.amount) || 0;

    if (tx.type === "income") income += amount;
    if (tx.type === "expense") expenses += amount;

    const row = document.createElement("tr");

    for (const value of [
      tx.date || "",
      tx.type === "income" ? "Mapato" : "Matumizi",
      tx.description || "",
      money(amount)
    ]) {
      const cell = document.createElement("td");
      cell.textContent = value;
      row.appendChild(cell);
    }

    const actionCell = document.createElement("td");
    const deleteButton = document.createElement("button");

    deleteButton.textContent = "Futa";
    deleteButton.style.width = "auto";

    deleteButton.addEventListener("click", async () => {
      if (!confirm("Una uhakika unataka kufuta muamala huu?")) return;

      try {
        await deleteDoc(doc(db, "transactions", tx.id));
        await loadTransactions();
      } catch (error) {
        message(errorText(error), true);
      }
    });

    actionCell.appendChild(deleteButton);
    row.appendChild(actionCell);
    body.appendChild(row);
  }

  $("income").textContent = money(income);
  $("expenses").textContent = money(expenses);
  $("balance").textContent = money(income - expenses);
  $("count").textContent = transactions.length;
}

$("transactionForm").addEventListener("submit", async event => {
  event.preventDefault();

  if (!currentUser) {
    message("Ingia kwanza.", true);
    return;
  }

  const amount = Number($("amount").value);
  const description = $("description").value.trim();
  const date = $("date").value;

  if (!description || !date || !Number.isFinite(amount) || amount <= 0) {
    message("Jaza maelezo, tarehe na kiasi sahihi.", true);
    return;
  }

  $("saveTransaction").disabled = true;

  try {
    await addDoc(collection(db, "transactions"), {
      uid: currentUser.uid,
      date,
      type: $("type").value,
      description,
      person: $("person").value.trim(),
      amount,
      createdAt: serverTimestamp()
    });

    $("transactionForm").reset();
    $("date").value = new Date().toISOString().slice(0, 10);

    await loadTransactions();
    message("Muamala umehifadhiwa.");
  } catch (error) {
    console.error("Save transaction error:", error);
    message(errorText(error), true);
  } finally {
    $("saveTransaction").disabled = false;
  }
});

$("downloadCSV").addEventListener("click", () => {
  if (!transactions.length) {
    message("Hakuna miamala ya kupakua.", true);
    return;
  }

  const rows = [
    ["Tarehe", "Aina", "Maelezo", "Mhusika", "Kiasi"],
    ...transactions.map(tx => [
      tx.date || "",
      tx.type || "",
      tx.description || "",
      tx.person || "",
      tx.amount || 0
    ])
  ];

  const csv = "\uFEFF" + rows.map(row =>
    row.map(value =>
      '"' + String(value ?? "").replace(/"/g, '""') + '"'
    ).join(",")
  ).join("\r\n");

  const url = URL.createObjectURL(
    new Blob([csv], { type: "text/csv;charset=utf-8;" })
  );

  const link = document.createElement("a");
  link.href = url;
  link.download = "IE-ShambaSmart-ripoti.csv";
  link.click();

  URL.revokeObjectURL(url);
});

$("printReport").addEventListener("click", () => window.print());
</script>
</body>
</html>
